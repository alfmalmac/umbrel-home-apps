version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-vasta_server_1
      APP_PORT: "5174"
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/ariedotme/vasta:0.6.0@sha256:9765a5f1a685a44c21734a8e55e8a83a310bf0d2a1902a2e42362586db2006a9
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      VASTA_WEB_URL: "http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data/vasta:/data
