version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-vasta_server_1
      APP_PORT: "5174"
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/ariedotme/vasta:0.4.1@sha256:b7c08f9906633e8534678d36150755cbed6a7cbb921bf7f7ccb9e1d124eb3e95
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      VASTA_WEB_URL: "http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data/vasta:/data
