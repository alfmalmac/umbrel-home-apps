version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-vasta_server_1
      APP_PORT: "5174"
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/ariedotme/vasta:0.7.1@sha256:92215c1a11f203a93c4938f7d8dc0e81b3c50cca1e4da165cdceb95015ff8ed7
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      VASTA_WEB_URL: "http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data/vasta:/data
