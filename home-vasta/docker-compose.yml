version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-vasta_server_1
      APP_PORT: "5174"
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/ariedotme/vasta:0.6.1@sha256:600255f6d3a4fef4b67f3c6400ef9b7483ee567b64998a1192ee9ebf0897eda7
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      VASTA_WEB_URL: "http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data/vasta:/data
